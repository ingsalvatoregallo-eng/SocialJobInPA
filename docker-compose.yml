# SocialJobInPA — stack locale (Windows + Docker Desktop + WSL2), progetto
# separato da JobInPA (che gira sulla VM Aruba): comunicano solo via API
# HTTP private (JOBINPA_API_URL/KEY, vedi .env.example).
#
#   .\scripts\setup.ps1   prima configurazione (crea .env, build, seed demo)
#   .\scripts\start.ps1   avvio
#   .\scripts\stop.ps1    arresto
#
# Dashboard:  http://localhost:8100/social
# Mailpit:    http://localhost:8026  (tutte le email di sviluppo finiscono qui)
#
# Porte diverse da JobInPA (8000/8025) apposta: le due macchine/stack devono
# poter girare insieme sullo stesso PC senza conflitti.
#
# Nessuna esposizione pubblica: tutte le porte sono su localhost. Per la
# futura esposizione dietro reverse proxy (social.jobinpa.it) vedi
# docs/deployment-future.md — non servono modifiche all'applicazione.

services:
  app:
    build: .
    env_file: .env
    environment:
      - APP_BASE_URL=${APP_BASE_URL:-http://localhost:8100}
    ports:
      - "127.0.0.1:8100:8000"
    volumes:
      - social-data:/app/data
      - ./assets:/app/assets
    depends_on:
      - mailpit
    restart: unless-stopped

  worker:
    build: .
    env_file: .env
    working_dir: /app/src
    command: ["python", "-m", "social.worker_main"]
    volumes:
      - social-data:/app/data
      - ./assets:/app/assets
    depends_on:
      - app
    restart: unless-stopped

  scheduler:
    build: .
    env_file: .env
    working_dir: /app/src
    command: ["python", "-m", "social.scheduler_main"]
    volumes:
      - social-data:/app/data
    depends_on:
      - app
    restart: unless-stopped

  mailpit:
    image: axllent/mailpit:latest
    ports:
      - "127.0.0.1:8026:8025"   # UI web (8026: 8025 e' gia' di JobInPA se presente)
      - "127.0.0.1:1026:1025"   # SMTP
    restart: unless-stopped

# Volume Docker nativo (non bind mount) per data/: i bind mount di Docker
# Desktop su Windows (WSL2/9p) non garantiscono coerenza della cache fra
# container diversi per l'I/O grezzo di SQLite (mmap/pread) — osservato in
# pratica: il worker non vedeva mai le righe scritte dal container app,
# pur essendo il file byte-identico via md5sum. Un volume nativo vive dentro
# il filesystem Linux della VM WSL2 di Docker Desktop, senza passare dal
# ponte col filesystem Windows: elimina il problema alla radice. Costo: il
# file non e' piu' sfogliabile da Esplora File — per backup/ispezione vedi
# scripts/backup.ps1 (passa da "docker compose exec").
volumes:
  social-data:
