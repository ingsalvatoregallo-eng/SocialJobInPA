<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Accesso — JobInPA Social AI</title>
<style>
body { font-family:"Segoe UI",system-ui,sans-serif; background:#0B3D91; display:flex;
       align-items:center; justify-content:center; min-height:100vh; margin:0; }
.box { background:#fff; border-radius:12px; padding:32px; width:340px; }
h1 { font-size:19px; margin:0 0 4px; } p.payoff { color:#6B7280; font-size:13px; margin:0 0 18px; }
input { width:100%; padding:9px; margin-bottom:12px; border:1px solid #E2E8F0; border-radius:7px; font:inherit; box-sizing:border-box; }
button { width:100%; padding:10px; background:#0B3D91; color:#fff; border:none; border-radius:7px; font-size:15px; cursor:pointer; }
.errore { background:#FDE8E8; color:#9B1C1C; padding:9px; border-radius:7px; font-size:13px; margin-bottom:12px; }
</style>
</head>
<body>
<div class="box">
  <h1>JobInPA Social AI</h1>
  <p class="payoff">Your PA, powered by AI</p>
  {% if errore %}<div class="errore">{{ errore }}</div>{% endif %}
  <form method="post" action="/social/login">
    <input type="email" name="email" placeholder="Email" required autofocus>
    <input type="password" name="password" placeholder="Password" required>
    <button type="submit">Accedi</button>
  </form>
</div>
</body>
</html>
